<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Võ Bá Quốc Đạt</title>
    <meta
      name="description"
      content="Trang cá nhân của Võ Bá Quốc Đạt — sinh viên Công nghệ thông tin tại Đại học Đông Á và Robotics Instructor & Competition Coach. Kỹ năng lập trình, dự án web và thành tích thi đấu Robotics."
    />
    <meta name="author" content="Võ Bá Quốc Đạt" />
    <link rel="icon" type="image/png" href="%BASE_URL%favicon.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <meta name="theme-color" content="#f1f2f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0d12" media="(prefers-color-scheme: dark)" />

    <!-- Open Graph / Facebook, Zalo, Messenger link preview -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="vi_VN" />
    <meta property="og:title" content="Võ Bá Quốc Đạt — Trang cá nhân" />
    <meta
      property="og:description"
      content="Sinh viên Công nghệ thông tin & Robotics Instructor. Kỹ năng lập trình, dự án web và thành tích thi đấu Robotics."
    />
    <meta property="og:image" content="%BASE_URL%og-image.png" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Võ Bá Quốc Đạt — Trang cá nhân" />
    <meta
      name="twitter:description"
      content="Sinh viên Công nghệ thông tin & Robotics Instructor. Kỹ năng lập trình, dự án web và thành tích thi đấu Robotics."
    />
    <meta name="twitter:image" content="%BASE_URL%og-image.png" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var theme =
            saved === "light" || saved === "dark"
              ? saved
              : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
